name: Despliegue de BrickStock a GitHub Pages

on:
  push:
    branches:
      - main

# ¡ESTA ES LA CLAVE PARA EL ERROR 128! Le damos permiso de escritura al bot
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        working-directory: ./brickstock
        run: flutter pub get

      - name: Compilar para Web
        working-directory: ./brickstock
        run: flutter build web --base-href "/TFG/"

      - name: Desplegar en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./brickstock/build/web